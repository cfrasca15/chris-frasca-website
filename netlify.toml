[build]
  functions = "netlify/functions"
  publish = "."

[functions."send-reminders"]
  schedule = "@daily"

[functions."fetch-google-reviews"]
  schedule = "@daily"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The city pages were first published as /medicare-agent-<city>.html and renamed
# to /medicare-help-<city>.html. Keep any old links and bookmarks working.
[[redirects]]
  from = "/medicare-agent-*"
  to = "/medicare-help-:splat"
  status = 301
  force = true

# Short link for review requests (texts, emails, signature, QR code).
[[redirects]]
  from = "/review"
  to = "https://g.page/r/CRUTtGvgRw2HEAE/review"
  status = 302
  force = true

# Images rarely change; let browsers keep them for a week.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
